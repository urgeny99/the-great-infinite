<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Pixel Video Generator</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; }
    main { width: min(96vw, 1100px); text-align: center; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.25rem, 3vw, 2rem); }
    .screen { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 2px solid #444; border-radius: 8px; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .controls { display: flex; justify-content: center; gap: .75rem; margin-top: 1rem; }
    button { border: 0; border-radius: 6px; padding: .7rem 1.4rem; color: #fff; background: #2878d0; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #3990ed; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { margin: .75rem 0 0; color: #aaa; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Random Pixel Video Generator</h1>
    <div class="screen">
      <canvas id="canvas" width="1280" height="720" aria-label="Random 720p pixel video"></canvas>
    </div>
    <div class="controls">
      <button id="start" type="button">Start feed</button>
      <button id="stop" type="button">Stop feed</button>
    </div>
    <p id="status" role="status">Feed running · 1280 × 720</p>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');
    const status = document.getElementById('status');
    let animationId = 0;
    let running = true;

    function makeFrame() {
      const pixels = ctx.createImageData(canvas.width, canvas.height);
      const data = pixels.data;
      for (let i = 0; i < data.length; i += 4) {
        data[i] = Math.random() * 256;
        data[i + 1] = Math.random() * 256;
        data[i + 2] = Math.random() * 256;
        data[i + 3] = 255;
      }
      ctx.putImageData(pixels, 0, 0);
    }

    function render() {
      if (!running) return;
      makeFrame();
      animationId = requestAnimationFrame(render);
    }

    function start() {
      if (running) return;
      running = true;
      status.textContent = 'Feed running · 1280 × 720';
      startButton.disabled = true;
      stopButton.disabled = false;
      render();
    }

    function stop() {
      if (!running) return;
      running = false;
      cancelAnimationFrame(animationId);
      status.textContent = 'Feed stopped · press “Start feed” to continue';
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    startButton.addEventListener('click', start);
    stopButton.addEventListener('click', stop);
    startButton.disabled = true;
    makeFrame();
    render();
  </script>
</body>
</html>
